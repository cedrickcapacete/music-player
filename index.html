<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canva Audio Player</title>

  <meta property="og:title" content="Audio Player">
  <meta property="og:description" content="Transparent Audio Player">
  <meta property="og:type" content="website">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .toggle-btn {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: transform 0.2s ease, background-color 0.2s ease;
      outline: none;
    }

    .toggle-btn:hover {
      transform: scale(1.08);
      background: rgba(0, 0, 0, 0.7);
    }

    .toggle-btn:active {
      transform: scale(0.95);
    }

    .icon {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .icon-pause { display: none; }
    .toggle-btn.is-playing .icon-play { display: none; }
    .toggle-btn.is-playing .icon-pause { display: block; }
  </style>
</head>
<body>

  <audio id="myAudio"></audio>

  <button class="toggle-btn" id="playPauseBtn" aria-label="Play">
    <svg class="icon icon-play" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
    <svg class="icon icon-pause" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>
  </button>

  <script>
    const btn = document.getElementById('playPauseBtn');
    const audio = document.getElementById('myAudio');

    // Automatically pulls music URL from ?src= parameter in the link
    const urlParams = new URLSearchParams(window.location.search);
    const musicUrl = urlParams.get('src');

    if (musicUrl) {
      audio.src = musicUrl;
    }

    btn.addEventListener('click', () => {
      if (!audio.src) {
        alert("No audio file found in the URL parameter!");
        return;
      }
      
      if (audio.paused) {
        audio.play();
        btn.classList.add('is-playing');
      } else {
        audio.pause();
        btn.classList.remove('is-playing');
      }
    });

    audio.addEventListener('ended', () => {
      btn.classList.remove('is-playing');
    });
  </script>
</body>
</html>
