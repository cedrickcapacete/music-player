<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Canva Audio Player</title>

  <meta property="og:title" content="Audio Player">
  <meta property="og:description" content="Transparent Audio Player">
  <meta property="og:type" content="website">
  
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      background: transparent;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .toggle-btn {
      background: rgba(0, 0, 0, 0.5);
      border: 2px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      width: 60px;
      height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: transform 0.2s ease, background-color 0.2s ease;
      outline: none;
    }

    .toggle-btn:hover {
      transform: scale(1.08);
      background: rgba(0, 0, 0, 0.7);
    }

    .toggle-btn:active {
      transform: scale(0.95);
    }

    .icon {
      width: 26px;
      height: 26px;
      fill: #ffffff;
    }

    .icon-pause { display: none; }
    .toggle-btn.is-playing .icon-play { display: none; }
    .toggle-btn.is-playing .icon-pause { display: block; }
  </style>
</head>
<body>

<audio controls id="myAudio">
  <source src="SoThisIsLove.mp3" type="audio/mpeg">
</audio>

  
  
</body>
</html>
